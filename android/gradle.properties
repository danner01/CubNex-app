org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.parallel=true

# Estabilidad en Windows cuando proyecto y cache estan en discos distintos
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2

# Ajusta la ruta si C: tiene poco espacio (crear la carpeta antes)
java.io.tmpdir=D:/gradle_tmp
