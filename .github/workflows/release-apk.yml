name: Build and release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing (keystore secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES_BASE64: ${{ secrets.KEY_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "$KEY_PROPERTIES_BASE64" | base64 -d > android/key.properties
            echo "Release keystore configured (stable App Links signing)."
          else
            echo "KEYSTORE_BASE64/KEY_PROPERTIES_BASE64 not configured; the build will use the debug keystore and App Links auto-verification will not work."
          fi

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Resolve version from pubspec
        id: version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          APP_VERSION=${RAW_VERSION%%+*}
          BUILD_NUMBER=${RAW_VERSION##*+}
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=apk-v${APP_VERSION}+${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Cubanex-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Cubanex-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/Cubanex-x86_64.apk

      - name: Upload APK to Vercel Blob
        id: blob_upload
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN || vars.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "BLOB_READ_WRITE_TOKEN not configured. Skipping Blob upload."
            exit 0
          fi
          npm init -y > /dev/null
          npm i @vercel/blob > /dev/null
          cat > upload-blob.mjs << 'EOF'
          import { put } from "@vercel/blob";
          import fs from "node:fs";
          const outputPath = process.env.GITHUB_OUTPUT;
          const files = [
            "Cubanex-arm64-v8a.apk",
            "Cubanex-armeabi-v7a.apk",
            "Cubanex-x86_64.apk",
          ];
          const outputKeys = {
            "Cubanex-arm64-v8a.apk": "arm64_url",
            "Cubanex-armeabi-v7a.apk": "armeabi_v7a_url",
            "Cubanex-x86_64.apk": "x86_64_url",
          };
          const urls = {};
          const token = process.env.BLOB_READ_WRITE_TOKEN;
          for (const fileName of files) {
            const stream = fs.createReadStream(`dist/${fileName}`);
            const blob = await put(fileName, stream, {
              access: "public",
              addRandomSuffix: false,
              allowOverwrite: true,
              token,
            });
            console.log(`${fileName}: ${blob.url}`);
            urls[fileName] = blob.url;
            if (outputPath) {
              fs.appendFileSync(outputPath, `${outputKeys[fileName]}=${blob.url}\n`);
            }
          }
          const primaryDownloadUrl =
            urls["Cubanex-arm64-v8a.apk"] ||
            urls["Cubanex-armeabi-v7a.apk"] ||
            urls["Cubanex-x86_64.apk"] ||
            "";
          if (outputPath) {
            fs.appendFileSync(outputPath, `primary_url=${primaryDownloadUrl}\n`);
          }
          EOF
          node upload-blob.mjs

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Cubanex APK v${{ steps.version.outputs.app_version }}+${{ steps.version.outputs.build_number }}
          artifacts: "dist/Cubanex-arm64-v8a.apk,dist/Cubanex-armeabi-v7a.apk,dist/Cubanex-x86_64.apk"
          allowUpdates: true
          replacesArtifacts: true
          generateReleaseNotes: true

      - name: Update Vercel env vars for APK landing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID }}
          APK_RELEASE_VERSION: ${{ steps.version.outputs.app_version }}
          APK_RELEASE_VERSION_CODE: ${{ steps.version.outputs.build_number }}
          APK_DOWNLOAD_URL: ${{ steps.blob_upload.outputs.primary_url }}
          APK_DOWNLOAD_URL_ARM64_V8A: ${{ steps.blob_upload.outputs.arm64_url }}
          APK_DOWNLOAD_URL_ARMEABI_V7A: ${{ steps.blob_upload.outputs.armeabi_v7a_url }}
          APK_DOWNLOAD_URL_X86_64: ${{ steps.blob_upload.outputs.x86_64_url }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_TOKEN or VERCEL_PROJECT_ID not configured. Skipping env sync."
            exit 0
          fi
          if [ -z "$APK_DOWNLOAD_URL" ]; then
            echo "Blob upload URL is empty. Skipping env sync."
            exit 0
          fi
          npm init -y > /dev/null
          cat > sync-vercel-env.mjs << 'EOF'
          const token = process.env.VERCEL_TOKEN;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const teamId = process.env.VERCEL_TEAM_ID;
          const apiBase = "https://api.vercel.com";
          const scope = teamId ? `?teamId=${encodeURIComponent(teamId)}` : "";
          const target = ["production"];

          const desired = {
            APK_RELEASE_VERSION: process.env.APK_RELEASE_VERSION,
            APK_RELEASE_VERSION_CODE: process.env.APK_RELEASE_VERSION_CODE,
            APK_RELEASE_ASSET_NAME: "Cubanex-arm64-v8a.apk",
            APK_DOWNLOAD_URL: process.env.APK_DOWNLOAD_URL,
            APK_DOWNLOAD_URL_ARM64_V8A: process.env.APK_DOWNLOAD_URL_ARM64_V8A,
            APK_DOWNLOAD_URL_ARMEABI_V7A: process.env.APK_DOWNLOAD_URL_ARMEABI_V7A,
            APK_DOWNLOAD_URL_X86_64: process.env.APK_DOWNLOAD_URL_X86_64,
          };

          async function api(path, init = {}) {
            const response = await fetch(`${apiBase}${path}${scope}`, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(init.headers || {}),
              },
            });
            if (!response.ok) {
              const body = await response.text();
              throw new Error(`Vercel API ${response.status} ${path}: ${body}`);
            }
            return response.status === 204 ? null : response.json();
          }

          const existing = await api(`/v9/projects/${projectId}/env`);
          const envs = existing?.envs || [];
          for (const [key, value] of Object.entries(desired)) {
            if (!value) continue;
            const matches = envs.filter((entry) => entry.key === key);
            for (const entry of matches) {
              await api(`/v9/projects/${projectId}/env/${entry.id}`, { method: "DELETE" });
            }
            await api(`/v10/projects/${projectId}/env`, {
              method: "POST",
              body: JSON.stringify({
                key,
                value,
                type: "encrypted",
                target,
              }),
            });
            console.log(`Upserted ${key}`);
          }
          EOF
          node sync-vercel-env.mjs

      - name: Trigger SuperAdmin redeploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL || vars.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not configured. Skipping redeploy."
            exit 0
          fi
          curl -X POST "$VERCEL_DEPLOY_HOOK_URL"
