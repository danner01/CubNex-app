name: Build and release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Resolve version from pubspec
        id: version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          APP_VERSION=${RAW_VERSION%%+*}
          BUILD_NUMBER=${RAW_VERSION##*+}
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=apk-v${APP_VERSION}+${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Cubanex.apk

      - name: Upload APK to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN || vars.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "BLOB_READ_WRITE_TOKEN not configured. Skipping Blob upload."
            exit 0
          fi
          npm init -y > /dev/null
          npm i @vercel/blob > /dev/null
          cat > upload-blob.mjs << 'EOF'
          import { put } from "@vercel/blob";
          import fs from "node:fs";
          const token = process.env.BLOB_READ_WRITE_TOKEN;
          const stream = fs.createReadStream("dist/Cubanex.apk");
          const blob = await put("Cubanex.apk", stream, {
            access: "public",
            addRandomSuffix: false,
            allowOverwrite: true,
            token,
          });
          console.log(`Uploaded to: ${blob.url}`);
          EOF
          node upload-blob.mjs

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Cubanex APK v${{ steps.version.outputs.app_version }}+${{ steps.version.outputs.build_number }}
          artifacts: "dist/Cubanex.apk"
          allowUpdates: true
          replacesArtifacts: true
          generateReleaseNotes: true

      - name: Trigger SuperAdmin redeploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL || vars.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not configured. Skipping redeploy."
            exit 0
          fi
          curl -X POST "$VERCEL_DEPLOY_HOOK_URL"
