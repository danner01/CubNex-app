name: Build and release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Resolve version from pubspec
        id: version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          APP_VERSION=${RAW_VERSION%%+*}
          BUILD_NUMBER=${RAW_VERSION##*+}
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=apk-v${APP_VERSION}+${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Cubanex.apk

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Cubanex APK v${{ steps.version.outputs.app_version }}+${{ steps.version.outputs.build_number }}
          artifacts: "dist/Cubanex.apk"
          allowUpdates: true
          replacesArtifacts: true
          generateReleaseNotes: true
